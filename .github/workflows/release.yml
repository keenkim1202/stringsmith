name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "만들 태그 (예: v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # 태그와 `stringsmith --version` 이 어긋난 채 배포되면
      # 받은 사람이 어떤 버전인지 알 수 없다. 여기서 막는다.
      - name: Check version matches tag
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "version: \"$version\"" Sources/stringsmith/Stringsmith.swift; then
            echo "::error::Sources/stringsmith/Stringsmith.swift 의 version 이 태그($version)와 다릅니다."
            grep -n 'version: "' Sources/stringsmith/Stringsmith.swift || true
            exit 1
          fi

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build release artifacts
        run: make release VERSION="${{ steps.version.outputs.version }}"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ## 설치

          ### 번역 확인 앱

          `StringsmithPreview-macOS.zip` 을 받아 압축을 풀고 `~/Applications` 또는
          `/Applications` 에 넣으세요.

          > **서명되지 않은 앱입니다.** 처음 열 때 macOS 가 막습니다. 다음 한 줄로 해제하세요:
          >
          > ```bash
          > xattr -dr com.apple.quarantine ~/Applications/StringsmithPreview.app
          > ```

          ### CLI

          ```bash
          brew install keenkim1202/tap/stringsmith
          ```

          `stringsmith` 와 짧은 이름 `ss` 가 함께 깔립니다.

          Homebrew 없이 받으실 경우:

          ```bash
          tar -xzf stringsmith-macOS.tar.gz
          sudo mv stringsmith /usr/local/bin/
          sudo ln -sf /usr/local/bin/stringsmith /usr/local/bin/ss
          xattr -dr com.apple.quarantine /usr/local/bin/stringsmith
          ```

          Intel · Apple Silicon 유니버설 바이너리입니다. macOS 13 이상이 필요합니다.
          NOTES

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --generate-notes \
            .build/dist/StringsmithPreview-macOS.zip \
            .build/dist/stringsmith-macOS.tar.gz

      # tap 의 formula 를 새 버전으로 올린다. 손으로 하면 잊는 날이 오고, 그날부터
      # brew 로 깐 사람만 옛 버전에 남는다. 릴리스가 만들어진 뒤에 돌리므로
      # 이 단계가 실패해도 릴리스 자체는 남는다.
      #
      # GITHUB_TOKEN 은 다른 저장소에 쓸 수 없어 PAT(repo 스코프)이 필요하다.
      - name: Bump the Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # 실제로 올린 그 파일의 해시여야 한다. 다시 받아서 재면 어긋날 여지가 생긴다.
          sha="$(shasum -a 256 .build/dist/stringsmith-macOS.tar.gz | cut -d' ' -f1)"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/keenkim1202/homebrew-tap.git" tap
          cd tap
          sed -i '' \
            -e "s|^  url .*|  url \"https://github.com/keenkim1202/stringsmith/releases/download/${TAG}/stringsmith-macOS.tar.gz\"|" \
            -e "s|^  sha256 .*|  sha256 \"${sha}\"|" \
            Formula/stringsmith.rb

          # sed 가 아무것도 못 바꾸고 조용히 지나갔는지 본다.
          grep -q "${TAG}/stringsmith-macOS.tar.gz" Formula/stringsmith.rb
          grep -q "sha256 \"${sha}\"" Formula/stringsmith.rb

          git config user.name "stringsmith release"
          git config user.email "homurahomus@gmail.com"
          git commit -qam "stringsmith ${TAG#v}"
          git push
