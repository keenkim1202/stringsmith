name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # 생성 파이프라인이 실제로 도는지 본다. 단위 테스트만으로는
      # CLI·설정·파일 쓰기가 이어지는 경로를 검증하지 못한다.
      - name: End-to-end
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/sample-sheet.csv "$work/strings.csv"
          cd "$work"
          "$GITHUB_WORKSPACE/.build/debug/stringsmith" init
          "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate
          test -f Resources/Localizable.xcstrings
          test -f Resources/L10n.swift
          # Apple 도구가 받아들이는 파일인지 확인한다.
          xcrun xcstringstool compile Resources/Localizable.xcstrings -o "$(mktemp -d)"
          # 생성된 접근자가 실제로 컴파일되는지 확인한다.
          swiftc -parse-as-library -typecheck Resources/L10n.swift
          # 두 번째 실행은 산출물을 바꾸지 않아야 한다 (결정적 출력).
          # 출력 문구는 러너의 시스템 언어에 따라 바뀌므로 파일 해시로 검사한다.
          before="$(shasum -a 256 Resources/* | sort)"
          "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate
          after="$(shasum -a 256 Resources/* | sort)"
          if [ "$before" != "$after" ]; then
            echo "::error::두 번째 실행이 산출물을 바꿨습니다 (출력이 결정적이지 않음)"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi

          # 두 언어 모두 출력이 나오는지 확인한다.
          STRINGSMITH_LANG=en "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate | grep -q "unchanged"
          STRINGSMITH_LANG=ko "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate | grep -q "변경 없음"

          # 파이프로 내보낼 때 색 이스케이프가 섞이면 로그·비교가 깨진다.
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          if "$ss" generate | grep -q $'\033'; then
            echo "::error::파이프 출력에 ANSI 이스케이프가 섞였습니다"
            exit 1
          fi
          FORCE_COLOR=1 "$ss" generate | grep -q $'\033' || {
            echo "::error::FORCE_COLOR 인데 색이 나오지 않았습니다"; exit 1; }
          if NO_COLOR=1 FORCE_COLOR=1 "$ss" generate | grep -q $'\033'; then
            echo "::error::NO_COLOR 가 FORCE_COLOR 를 이기지 못했습니다"
            exit 1
          fi

      # validate 는 파일을 만들지 않아야 하고, generate 와 같은 판단을 해야 한다.
      - name: Validate command
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/edge-cases.csv "$work/strings.csv"
          cd "$work"
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init >/dev/null
          STRINGSMITH_LANG=en "$ss" validate | tee validate.txt
          # 경고는 원인이 된 키와 행을 짚어야 한다. 건수만으로는 고칠 곳을 모른다.
          grep -qE "translations missing" validate.txt
          grep -qE "\(row [0-9]+\)" validate.txt
          # 검증만 하겠다고 불렀는데 산출물이 생기면 안 된다.
          if [ -d Resources ]; then
            echo "::error::validate 가 파일을 만들었습니다"
            exit 1
          fi
          # 경고는 기본으로 통과, --strict 에서는 실패.
          if ! STRINGSMITH_LANG=en "$ss" validate >/dev/null; then
            echo "::error::경고만 있는데 validate 가 실패했습니다"; exit 1
          fi
          if STRINGSMITH_LANG=en "$ss" validate --strict >/dev/null 2>&1; then
            echo "::error::--strict 인데 경고를 통과시켰습니다"; exit 1
          fi

      # 이름이 충돌하면 산출물이 나오면 안 된다. 나온 뒤에는 알아채기 어려운 문제다.
      - name: Name collisions block generate
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf 'key,ko,en\na.hello_world,가,A\na.helloWorld,나,B\n' > strings.csv
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init >/dev/null
          if STRINGSMITH_LANG=en "$ss" generate; then
            echo "::error::이름이 충돌하는데 generate 가 통과했습니다"
            exit 1
          fi
          if [ -f Resources/Localizable.xcstrings ]; then
            echo "::error::차단됐는데 산출물이 만들어졌습니다"
            exit 1
          fi
          # 설정으로 풀 수 있어야 한다.
          python3 - <<'PY'
          import json
          d = json.load(open('.stringsmith.json'))
          d['validation'] = {'failOn': []}
          json.dump(d, open('.stringsmith.json', 'w'))
          PY
          STRINGSMITH_LANG=en "$ss" generate
          test -f Resources/Localizable.xcstrings

      # 인증 커맨드는 네트워크 없이도 올바른 안내를 내야 한다.
      - name: Auth commands
        run: |
          set -euo pipefail
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          # 클라이언트가 없으면 발급 절차 전체를 그대로 보여 줘야 한다.
          # 여기서 막힌 사람은 다른 문서를 찾아갈 수 없다.
          STRINGSMITH_LANG=en "$ss" auth status | tee status.txt
          grep -q "console.cloud.google.com" status.txt
          grep -q "client.json" status.txt
          grep -q "STRINGSMITH_GOOGLE_CLIENT_ID" status.txt
          # 로그인한 적 없을 때 지울 게 없다고 말하고 0으로 끝나야 한다.
          STRINGSMITH_LANG=en "$ss" auth logout | grep -q "nothing to remove"
          STRINGSMITH_LANG=en "$ss" auth --help | grep -q "login"

          # setup 은 빈 파일을 만들고, 이미 있으면 덮어쓰지 않아야 한다.
          home="$(mktemp -d)"
          HOME="$home" STRINGSMITH_LANG=en "$ss" auth setup | grep -q "Created"
          test -f "$home/.config/stringsmith/client.json"
          # 만들어 둔 파일은 미설정으로 읽혀야 한다 (값이 비어 있으므로).
          HOME="$home" STRINGSMITH_LANG=en "$ss" auth status | grep -q "console.cloud.google.com"
          HOME="$home" STRINGSMITH_LANG=en "$ss" auth setup | grep -q "already exists"

      # 파서·변수 변환·코드 생성의 까다로운 경우를 모아둔 시트. 회귀를 여기서 잡는다.
      - name: Edge cases
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/edge-cases.csv "$work/strings.csv"
          cd "$work"
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init
          STRINGSMITH_LANG=en "$ss" generate
          xcrun xcstringstool compile Resources/Localizable.xcstrings -o "$(mktemp -d)"
          swiftc -parse-as-library -typecheck Resources/L10n.swift

          check() {
            if ! grep -qF "$1" "$2"; then
              echo "::error::기대한 내용이 없습니다: $1 ($2)"
              exit 1
            fi
          }
          cat="Resources/Localizable.xcstrings"
          gen="Resources/L10n.swift"
          # 같은 변수를 두 번 쓰면 위치 지정자로 재사용해야 한다 (인자 하나)
          check 'Hello %1$@, welcome back %1$@' "$cat"
          check 'func welcomeBack(_ arg1: String) -> String' "$gen"
          # 어순이 바뀐 번역도 원문의 번호를 따라간다
          check '%2$@ notes shared by %1$@' "$cat"
          # 변수가 하나면 위치 번호를 붙이지 않는다
          check '%@ notes' "$cat"
          # 리터럴 퍼센트는 변수가 있을 때만 이스케이프한다
          check '50%% off for %@' "$cat"
          check '100% complete' "$cat"
          # 이스케이프한 중괄호는 리터럴, 겹친 중괄호는 안쪽이 변수
          check 'Format example: {name}' "$cat"
          check '{%@} items' "$cat"
          # Swift 예약어·이름 충돌·숫자 시작
          check 'static var `default`: String' "$gen"
          check 'helloWorld2' "$gen"
          check 'static var _1st: String' "$gen"

  # 릴리스에서 쓰는 유니버설 빌드를 **배포 없이** 검증한다.
  #
  # 한 번의 --arch arm64 --arch x86_64 호출이 러너의 Xcode 에서 깨진 적이 있는데,
  # 로컬 Xcode 에서는 통과해 릴리스 때가 되어서야 드러났다. 여기서 미리 잡는다.
  release-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal artifacts
        run: make release VERSION=0.0.0-ci

      - name: Check the artifacts actually work
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          tar -xzf "$GITHUB_WORKSPACE/.build/dist/stringsmith-macOS.tar.gz"
          ./stringsmith --version
          lipo -archs ./stringsmith | tee archs.txt
          grep -q x86_64 archs.txt && grep -q arm64 archs.txt

          ditto -x -k "$GITHUB_WORKSPACE/.build/dist/StringsmithPreview-macOS.zip" .
          test -f StringsmithPreview.app/Contents/MacOS/StringsmithPreview
          test -f StringsmithPreview.app/Contents/Info.plist
          for lang in en ko ja; do
            test -d "StringsmithPreview.app/Contents/Resources/stringsmith_StringsmithPreview.bundle/$lang.lproj"
          done
          lipo -archs StringsmithPreview.app/Contents/MacOS/StringsmithPreview

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .build/dist/*
          retention-days: 7
