name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # 생성 파이프라인이 실제로 도는지 본다. 단위 테스트만으로는
      # CLI·설정·파일 쓰기가 이어지는 경로를 검증하지 못한다.
      - name: End-to-end
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/sample-sheet.csv "$work/strings.csv"
          cd "$work"
          "$GITHUB_WORKSPACE/.build/debug/stringsmith" init
          "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate
          test -f Resources/Localizable.xcstrings
          test -f Resources/L10n.swift
          # Apple 도구가 받아들이는 파일인지 확인한다.
          xcrun xcstringstool compile Resources/Localizable.xcstrings -o "$(mktemp -d)"
          # 생성된 접근자가 실제로 컴파일되는지 확인한다.
          swiftc -parse-as-library -typecheck Resources/L10n.swift
          # 두 번째 실행은 산출물을 바꾸지 않아야 한다 (결정적 출력).
          # 출력 문구는 러너의 시스템 언어에 따라 바뀌므로 파일 해시로 검사한다.
          before="$(shasum -a 256 Resources/* | sort)"
          "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate
          after="$(shasum -a 256 Resources/* | sort)"
          if [ "$before" != "$after" ]; then
            echo "::error::두 번째 실행이 산출물을 바꿨습니다 (출력이 결정적이지 않음)"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi

          # 두 언어 모두 출력이 나오는지 확인한다.
          grep -q "unchanged" <<< "$(STRINGSMITH_LANG=en "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate)"
          grep -q "변경 없음" <<< "$(STRINGSMITH_LANG=ko "$GITHUB_WORKSPACE/.build/debug/stringsmith" generate)"

          # 파이프로 내보낼 때 색 이스케이프가 섞이면 로그·비교가 깨진다.
          # 파일로 받아 두고 검사한다 — `| grep -q` 로 하면 grep 이 일치하는 순간 파이프를
          # 닫아 stringsmith 가 SIGPIPE 로 죽고, pipefail 이 그걸 실패로 본다.
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          "$ss" generate > plain.txt
          FORCE_COLOR=1 "$ss" generate > forced.txt
          NO_COLOR=1 FORCE_COLOR=1 "$ss" generate > suppressed.txt

          if grep -q $'\033' plain.txt; then
            echo "::error::파이프 출력에 ANSI 이스케이프가 섞였습니다"
            exit 1
          fi
          if ! grep -q $'\033' forced.txt; then
            echo "::error::FORCE_COLOR 인데 색이 나오지 않았습니다"
            exit 1
          fi
          if grep -q $'\033' suppressed.txt; then
            echo "::error::NO_COLOR 가 FORCE_COLOR 를 이기지 못했습니다"
            exit 1
          fi

      # validate 는 파일을 만들지 않아야 하고, generate 와 같은 판단을 해야 한다.
      - name: Validate command
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/edge-cases.csv "$work/strings.csv"
          cd "$work"
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init >/dev/null
          # 이 시트는 **문제를 담는 게 목적**이다. 이름 충돌도 일부러 들어 있으므로
          # 기본값(collision 에서 멈춤)을 그대로 쓰면 픽스처를 쓸 수가 없다.
          # 충돌이 보고되는지는 아래에서 따로 확인한다.
          python3 - <<'PY'
          import json
          d = json.load(open('.stringsmith.json'))
          d['validation'] = {'failOn': []}
          json.dump(d, open('.stringsmith.json', 'w'))
          PY
          STRINGSMITH_LANG=en "$ss" validate | tee validate.txt
          # 픽스처의 충돌이 실제로 보고되는지.
          grep -q "Name collision" validate.txt
          # 경고는 원인이 된 키와 행을 짚어야 한다. 건수만으로는 고칠 곳을 모른다.
          grep -qE "translations missing" validate.txt
          grep -qE "\(row [0-9]+\)" validate.txt
          # 검증만 하겠다고 불렀는데 산출물이 생기면 안 된다.
          if [ -d Resources ]; then
            echo "::error::validate 가 파일을 만들었습니다"
            exit 1
          fi
          # 경고는 기본으로 통과, --strict 에서는 실패.
          if ! STRINGSMITH_LANG=en "$ss" validate >/dev/null; then
            echo "::error::경고만 있는데 validate 가 실패했습니다"; exit 1
          fi
          if STRINGSMITH_LANG=en "$ss" validate --strict >/dev/null 2>&1; then
            echo "::error::--strict 인데 경고를 통과시켰습니다"; exit 1
          fi

      # 이름이 충돌하면 산출물이 나오면 안 된다. 나온 뒤에는 알아채기 어려운 문제다.
      - name: Name collisions block generate
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf 'key,ko,en\na.hello_world,가,A\na.helloWorld,나,B\n' > strings.csv
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init >/dev/null
          if STRINGSMITH_LANG=en "$ss" generate; then
            echo "::error::이름이 충돌하는데 generate 가 통과했습니다"
            exit 1
          fi
          if [ -f Resources/Localizable.xcstrings ]; then
            echo "::error::차단됐는데 산출물이 만들어졌습니다"
            exit 1
          fi
          # 설정으로 풀 수 있어야 한다.
          python3 - <<'PY'
          import json
          d = json.load(open('.stringsmith.json'))
          d['validation'] = {'failOn': []}
          json.dump(d, open('.stringsmith.json', 'w'))
          PY
          STRINGSMITH_LANG=en "$ss" generate
          test -f Resources/Localizable.xcstrings

      # README 가 실제와 어긋나는 건 조용히 일어난다. 적어 둔 것이 진짜인지 확인한다.
      - name: Docs match the tool
        run: |
          set -euo pipefail
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"

          # 문서에 적힌 커맨드·옵션이 실제로 있는가.
          for c in init generate validate drift preview auth; do
            "$ss" "$c" --help >/dev/null
          done
          grep -q -- --url <<< "$("$ss" init --help)"
          grep -q -- --strict <<< "$("$ss" validate --help)"
          grep -q -- --strict <<< "$("$ss" drift --help)"

          # 설정 예시가 파싱될 뿐 아니라 실제로 돌아가는가.
          work="$(mktemp -d)"
          python3 - "$work" <<'PY'
          import json, re, sys, csv
          work = sys.argv[1]
          block = re.search(r'## Configuration\n\n```json\n(.*?)\n```',
                            open('README.md').read(), re.S).group(1)
          json.dump(json.loads(block), open(f'{work}/.stringsmith.json', 'w'),
                    indent=2, ensure_ascii=False)
          w = csv.writer(open(f'{work}/strings.csv', 'w', newline='', encoding='utf-8'))
          w.writerow(['번역 시트', '', '', '', '', ''])
          w.writerow(['키', '화면', '설명', '한국어', '영어', '일본어'])
          w.writerow(['home.title', '홈', '제목', '홈', 'Home', 'ホーム'])
          PY
          (cd "$work" && STRINGSMITH_LANG=en "$ss" validate)

          # 편집이 표 중간에 끼어들어 뒷부분이 머리글 없는 조각으로 떨어진 적이 있다.
          python3 Scripts/check-tables.py README.md README.ko.md CHANGELOG.md CHANGELOG.ko.md

          # 문서가 가리키는 파일이 실재하는가.
          python3 - <<'PY'
          import os, re, sys
          missing = []
          for doc in ['README.md', 'README.ko.md', 'CHANGELOG.md', 'CHANGELOG.ko.md',
                      'Examples/DemoApp/README.md']:
              base = os.path.dirname(doc)
              for _, target in re.findall(r'\[([^\]]+)\]\(([^)]+)\)', open(doc).read()):
                  if target.startswith(('http', '#')):
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(base, target))):
                      missing.append(f'{doc} → {target}')
          if missing:
              sys.exit('죽은 링크: ' + ', '.join(missing))
          PY

          # 릴리스에 적히는 버전과 바이너리가 말하는 버전이 같아야 한다.
          make_version="$(grep -E '^VERSION \?=' Makefile | sed 's/.*= *//')"
          cli_version="$("$ss" --version)"
          if [ "$make_version" != "$cli_version" ]; then
            echo "::error::Makefile 은 $make_version, 바이너리는 $cli_version"
            exit 1
          fi
          # 변경 이력에 그 버전이 있어야 한다.
          grep -q "^## $cli_version" CHANGELOG.md
          grep -q "^## $cli_version" CHANGELOG.ko.md

      # 예제가 실제로 돌아야 예제다. 커밋된 산출물이 시트와 어긋나는 것도 여기서 잡는다.
      - name: Example app
        run: |
          set -euo pipefail
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          cd Examples/DemoApp

          # 커밋된 산출물이 시트에서 다시 만든 것과 같은가.
          before="$(find Sources/DemoApp -type f -exec shasum {} \; | sort)"
          "$ss" generate >/dev/null
          after="$(find Sources/DemoApp -type f -exec shasum {} \; | sort)"
          if [ "$before" != "$after" ]; then
            echo "::error::예제의 커밋된 산출물이 낡았습니다 — stringsmith generate 를 돌리세요"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi

          swift build
          # 키가 그대로 나오면 번들이 문자열을 못 찾은 것이다.
          # 검사 결과는 저장소 밖에 둔다. 안에 쓰면 예제 디렉터리가 더러워진다.
          out="$(mktemp -d)"
          swift run DemoApp --dump --lang ko | tee "$out/ko.txt"
          grep -q "스트링스미스 데모" "$out/ko.txt"
          if grep -qE "^(app|cart)\." "$out/ko.txt"; then
            echo "::error::번역 대신 키가 나왔습니다"
            exit 1
          fi
          # 복수형이 수에 따라 달라지는가 (영어는 one/other 가 다르다).
          swift run DemoApp --dump --lang en | tee "$out/en.txt"
          grep -q "1 item" "$out/en.txt"
          grep -q "3 items" "$out/en.txt"

      # 엑셀은 ZIP 이라 CSV 경로로 새어 들어가면 "UTF-8 이 아니다" 로만 끝난다.
      - name: XLSX source
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/sample-sheet.xlsx "$work/strings.xlsx"
          cd "$work"
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init | tee init.txt
          # 여러 시트면 어느 것을 읽는지 알려 줘야 한다.
          grep -q "sheets" init.txt
          grep -q '"type" : "xlsx"' .stringsmith.json || grep -q '"type": "xlsx"' .stringsmith.json
          STRINGSMITH_LANG=en "$ss" generate >/dev/null
          xcrun xcstringstool compile Resources/Localizable.xcstrings -o "$(mktemp -d)"

          python3 - <<'PY'
          import json, sys
          d = json.load(open('Resources/Localizable.xcstrings'))['strings']
          # XML 이스케이프가 되돌아왔는가.
          if d['home.title']['localizations']['ko']['stringUnit']['value'] != '홈 & <중요>':
              sys.exit('XML 이스케이프가 풀리지 않았습니다')
          # 빠진 칸이 있어도 열이 밀리지 않았는가 — 밀렸다면 ko 가 en 자리에 온다.
          if 'en' in d['cart.empty'].get('localizations', {}):
              sys.exit('en 이 비어야 하는데 값이 들어갔습니다 (열이 밀렸습니다)')
          PY

      # 형식은 택일이다. 바꾸면 이전 형식이 남으면 안 된다.
      - name: Output format switch
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf 'key,ko,en\ncart.title,장바구니,Cart\n' > strings.csv
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"

          STRINGSMITH_LANG=en "$ss" init --format strings >/dev/null
          STRINGSMITH_LANG=en "$ss" generate >/dev/null
          test -f Resources/en.lproj/Localizable.strings
          test ! -f Resources/Localizable.xcstrings
          # 형식과 무관한 swift 는 유지돼야 한다.
          test -f Resources/L10n.swift

          # 이번 실행만 다른 형식으로.
          rm -rf Resources
          STRINGSMITH_LANG=en "$ss" generate --format xcstrings >/dev/null
          test -f Resources/Localizable.xcstrings
          test ! -f Resources/en.lproj/Localizable.strings
          test -f Resources/L10n.swift

          if STRINGSMITH_LANG=en "$ss" generate --format json >/dev/null 2>&1; then
            echo "::error::모르는 형식을 통과시켰습니다"; exit 1
          fi

      # 복수형은 Apple 도구가 읽을 수 있는 plist 여야 하고, 세는 변수가 정수여야 한다.
      - name: Plurals and legacy output
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          cat > strings.csv <<'CSV'
          key,ko,en,ru
          cart.title,장바구니,Cart,Корзина
          cart.items.one,,{count} item,{count} товар
          cart.items.few,,,{count} товара
          cart.items.many,,,{count} товаров
          cart.items.other,상품 {count}개,{count} items,{count} товара
          CSV
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init >/dev/null
          python3 - <<'PY'
          import json
          d = json.load(open('.stringsmith.json'))
          # swift 를 빼면 아래에서 접근자를 확인할 수 없다.
          d['output']['artifacts'] = ['strings', 'stringsdict', 'swift']
          json.dump(d, open('.stringsmith.json', 'w'))
          PY
          STRINGSMITH_LANG=en "$ss" generate >/dev/null

          # Apple 도구가 읽을 수 있어야 한다.
          plutil -lint Resources/*/Localizable.stringsdict
          plutil -lint Resources/*/Localizable.strings

          # String Catalog 도 복수형을 제대로 담아야 한다.
          rm -rf Resources
          STRINGSMITH_LANG=en "$ss" generate --format xcstrings >/dev/null
          python3 - <<'PY'
          import json, sys
          d = json.load(open('Resources/Localizable.xcstrings'))['strings']
          if 'cart.items' not in d:
              sys.exit('복수형이 묶이지 않았습니다')
          if 'cart.items.one' in d:
              sys.exit('접미사 키가 따로 남았습니다')
          en = d['cart.items']['localizations']['en']
          if 'variations' not in en:
              sys.exit('variations.plural 이 아닙니다')
          PY
          # Apple 도구가 복수 규칙으로 컴파일하는지.
          out="$(mktemp -d)"
          xcrun xcstringstool compile Resources/Localizable.xcstrings -o "$out"
          grep -q NSStringPluralRuleType <<< "$(plutil -p "$out"/en.lproj/Localizable.stringsdict)"
          # 접근자는 묶음마다 하나이고 Int 를 받는다.
          grep -q "func items(_ arg1: Int)" Resources/L10n.swift
          if grep -qE "itemsOne|itemsOther" Resources/L10n.swift; then
            echo "::error::복수형이 접근자 두 개로 나왔습니다"; exit 1
          fi
          swiftc -parse-as-library -typecheck Resources/L10n.swift

          rm -rf Resources
          STRINGSMITH_LANG=en "$ss" generate >/dev/null
          # 세는 변수는 %d 여야 한다 — %@ 면 iOS 가 범주를 고를 수 없다.
          grep -q "<string>%d items</string>" Resources/en.lproj/Localizable.stringsdict
          grep -q "<string>d</string>" Resources/en.lproj/Localizable.stringsdict
          # 원문이 비어 있는 행도 변환돼야 한다.
          if grep -q "{count}" Resources/ru.lproj/Localizable.stringsdict; then
            echo "::error::원문이 없는 복수형 행이 변환되지 않았습니다"
            exit 1
          fi
          # 복수형은 strings 가 아니라 stringsdict 로 간다.
          if grep -q "cart.items" Resources/en.lproj/Localizable.strings; then
            echo "::error::복수형이 .strings 에 들어갔습니다"
            exit 1
          fi
          grep -q "cart.title" Resources/en.lproj/Localizable.strings

          # 한국어는 other 뿐이라 one 칸이 비는 게 정상이다. 누락으로 잡으면 안 된다.
          STRINGSMITH_LANG=en "$ss" validate | tee v.txt
          if grep -q "cart.items.one" v.txt; then
            echo "::error::원문 언어가 쓰지 않는 복수형을 누락으로 보고했습니다"
            exit 1
          fi

      # 드리프트는 양방향을 다 봐야 하고, 생성된 파일에 속으면 안 된다.
      - name: Drift detection
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/Sources"
          cd "$work"
          printf 'key,ko,en\nhome.title,홈,Home\nunused.key,안 씀,Unused\n' > strings.csv
          cat > Sources/App.swift <<'SWIFT'
          let a = L10n.Home.title
          let b = NSLocalizedString("not.in.sheet", comment: "")
          SWIFT
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init >/dev/null
          STRINGSMITH_LANG=en "$ss" generate >/dev/null
          STRINGSMITH_LANG=en "$ss" drift | tee drift.txt

          # 시트에만 있는 키
          grep -q "unused.key" drift.txt
          # 코드에만 있는 키 — 파일과 줄까지
          grep -qE "not.in.sheet .*Sources/App.swift:2" drift.txt
          # 쓰고 있는 키는 나오면 안 된다
          if grep -q "home.title" drift.txt; then
            echo "::error::쓰고 있는 키를 미사용으로 보고했습니다"
            exit 1
          fi
          # 생성된 파일을 훑으면 모든 키가 "사용 중" 이 되어 아무것도 안 나온다
          if ! grep -q "never used in code" drift.txt; then
            echo "::error::생성된 파일까지 세어 미사용을 놓쳤습니다"
            exit 1
          fi
          if STRINGSMITH_LANG=en "$ss" drift --strict >/dev/null 2>&1; then
            echo "::error::--strict 인데 드리프트를 통과시켰습니다"; exit 1
          fi

      # 인증 커맨드는 네트워크 없이도 올바른 안내를 내야 한다.
      - name: Auth commands
        run: |
          set -euo pipefail
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          # 이 단계는 저장소 루트에서 돈다. 검사 파일을 여기 쓰면 트리가 더러워진다.
          out="$(mktemp -d)"

          # 클라이언트가 없으면 발급 절차 전체를 그대로 보여 줘야 한다.
          # 여기서 막힌 사람은 다른 문서를 찾아갈 수 없다.
          STRINGSMITH_LANG=en "$ss" auth status > "$out/status.txt"
          grep -q "console.cloud.google.com" "$out/status.txt"
          grep -q "client.json" "$out/status.txt"
          grep -q "STRINGSMITH_GOOGLE_CLIENT_ID" "$out/status.txt"
          # 로그인한 적 없을 때 지울 게 없다고 말하고 0으로 끝나야 한다.
          grep -q "nothing to remove" <<< "$(STRINGSMITH_LANG=en "$ss" auth logout)"
          grep -q "login" <<< "$(STRINGSMITH_LANG=en "$ss" auth --help)"

          # setup 은 빈 파일을 만들고, 이미 있으면 덮어쓰지 않아야 한다.
          home="$(mktemp -d)"
          grep -q "Created" <<< "$(HOME="$home" STRINGSMITH_LANG=en "$ss" auth setup)"
          test -f "$home/.config/stringsmith/client.json"
          # 만들어 둔 파일은 미설정으로 읽혀야 한다 (값이 비어 있으므로).
          grep -q "console.cloud.google.com" <<< "$(HOME="$home" STRINGSMITH_LANG=en "$ss" auth status)"
          grep -q "already exists" <<< "$(HOME="$home" STRINGSMITH_LANG=en "$ss" auth setup)"

      # 파서·변수 변환·코드 생성의 까다로운 경우를 모아둔 시트. 회귀를 여기서 잡는다.
      - name: Edge cases
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Examples/edge-cases.csv "$work/strings.csv"
          cd "$work"
          ss="$GITHUB_WORKSPACE/.build/debug/stringsmith"
          STRINGSMITH_LANG=en "$ss" init
          # 이 픽스처는 이름 충돌을 일부러 담고 있다 (Validate 단계 참고).
          python3 - <<'PY'
          import json
          d = json.load(open('.stringsmith.json'))
          d['validation'] = {'failOn': []}
          json.dump(d, open('.stringsmith.json', 'w'))
          PY
          STRINGSMITH_LANG=en "$ss" generate
          xcrun xcstringstool compile Resources/Localizable.xcstrings -o "$(mktemp -d)"
          swiftc -parse-as-library -typecheck Resources/L10n.swift

          check() {
            if ! grep -qF "$1" "$2"; then
              echo "::error::기대한 내용이 없습니다: $1 ($2)"
              exit 1
            fi
          }
          cat="Resources/Localizable.xcstrings"
          gen="Resources/L10n.swift"
          # 같은 변수를 두 번 쓰면 위치 지정자로 재사용해야 한다 (인자 하나)
          check 'Hello %1$@, welcome back %1$@' "$cat"
          check 'func welcomeBack(_ arg1: String) -> String' "$gen"
          # 어순이 바뀐 번역도 원문의 번호를 따라간다
          check '%2$@ notes shared by %1$@' "$cat"
          # 변수가 하나면 위치 번호를 붙이지 않는다
          check '%@ notes' "$cat"
          # 리터럴 퍼센트는 변수가 있을 때만 이스케이프한다
          check '50%% off for %@' "$cat"
          check '100% complete' "$cat"
          # 이스케이프한 중괄호는 리터럴, 겹친 중괄호는 안쪽이 변수
          check 'Format example: {name}' "$cat"
          check '{%@} items' "$cat"
          # Swift 예약어·이름 충돌·숫자 시작
          check 'static var `default`: String' "$gen"
          check 'helloWorld2' "$gen"
          check 'static var _1st: String' "$gen"

  # 릴리스에서 쓰는 유니버설 빌드를 **배포 없이** 검증한다.
  #
  # 한 번의 --arch arm64 --arch x86_64 호출이 러너의 Xcode 에서 깨진 적이 있는데,
  # 로컬 Xcode 에서는 통과해 릴리스 때가 되어서야 드러났다. 여기서 미리 잡는다.
  release-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal artifacts
        run: make release VERSION=0.0.0-ci

      - name: Check the artifacts actually work
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          tar -xzf "$GITHUB_WORKSPACE/.build/dist/stringsmith-macOS.tar.gz"
          ./stringsmith --version
          lipo -archs ./stringsmith | tee archs.txt
          grep -q x86_64 archs.txt && grep -q arm64 archs.txt

          ditto -x -k "$GITHUB_WORKSPACE/.build/dist/StringsmithPreview-macOS.zip" .
          test -f StringsmithPreview.app/Contents/MacOS/StringsmithPreview
          test -f StringsmithPreview.app/Contents/Info.plist
          for lang in en ko ja; do
            test -d "StringsmithPreview.app/Contents/Resources/stringsmith_StringsmithPreview.bundle/$lang.lproj"
          done
          lipo -archs StringsmithPreview.app/Contents/MacOS/StringsmithPreview

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: .build/dist/*
          retention-days: 7
